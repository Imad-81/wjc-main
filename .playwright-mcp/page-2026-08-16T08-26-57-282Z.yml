          - heading "Frequently Asked Questions" [level=2] [ref=f6e313]
          - paragraph [ref=f6e314]: Everything you need to know about the Woxsen Japan Centre and how to get involved.
          - link "japan.centre@woxsen.edu.in →" [ref=f6e316] [cursor=pointer]:
