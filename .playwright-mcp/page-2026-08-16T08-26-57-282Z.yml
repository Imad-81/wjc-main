        - generic [ref=f6e318]:
          - generic [ref=f6e319]:
            - heading [level=3] [ref=f6e320]:
              - button "Who can join the Woxsen Japan Centre?" [ref=f6e321] [cursor=pointer]
            - region "Who can join the Woxsen Japan Centre?":
              - paragraph [ref=f6e325]: The Centre is open to all Woxsen University students, faculty, staff, and external professionals. We welcome anyone with a genuine interest in Japanese language, culture, or academic and industry collaboration.
          - generic [ref=f6e326]:
            - heading [level=3] [ref=f6e327]:
              - button "What Japanese language levels are offered?" [ref=f6e328] [cursor=pointer]
            - region "What Japanese language levels are offered?":
              - paragraph [ref=f6e332]: We currently offer JLPT N5 (beginner) and N4 (elementary) preparation courses led by qualified instructors. We have plans to expand to N3 and beyond based on community demand.
          - generic [ref=f6e333]:
            - heading [level=3] [ref=f6e334]:
              - button "Are there opportunities to visit Japan?" [ref=f6e335] [cursor=pointer]
            - region "Are there opportunities to visit Japan?":
              - paragraph [ref=f6e339]: Yes. Through our partnerships with Indobox Inc. and Nara Japan Centre, we facilitate student exchanges, internships, and study tours to Japan. These opportunities are announced throughout the academic year.
          - generic [ref=f6e340]:
            - heading [level=3] [ref=f6e341]:
              - button "How often are cultural events held?" [ref=f6e342] [cursor=pointer]
            - region "How often are cultural events held?":
              - paragraph [ref=f6e346]: We host monthly cultural events, seasonal festivals aligned with the Japanese calendar, and an annual Indo-Japan Academic Summit. Our programming spans language workshops, film screenings, culinary experiences, and traditional arts.
          - generic [ref=f6e347]:
            - heading [level=3] [ref=f6e348]:
              - button "Is membership free for students?" [ref=f6e349] [cursor=pointer]
            - region "Is membership free for students?":
              - paragraph [ref=f6e353]: Student membership is completely free of charge. Simply register using your Woxsen University email address. There are no hidden fees for language classes, cultural events, or community activities.
          - generic [ref=f6e354]:
            - heading [level=3] [ref=f6e355]:
              - button "How can Japanese companies collaborate with the Centre?" [ref=f6e356] [cursor=pointer]
            - region "How can Japanese companies collaborate with the Centre?":
              - paragraph [ref=f6e360]: We warmly welcome industry partnerships, internship programs, and corporate collaborations. Please contact us at japan.centre@woxsen.edu.in with your collaboration proposal. With 1,400+ Japanese companies operating in India, we are positioned to create meaningful connections.
