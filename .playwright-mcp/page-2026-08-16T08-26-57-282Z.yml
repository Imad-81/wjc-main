            - paragraph [ref=f6e292]: “
            - blockquote [ref=f6e293]:
              - paragraph [ref=f6e294]: I joined the Japanese course to learn the language, but they soon became the best part of my day. Each session is engaging and helps us learn not just the language, but also the culture in a clear and easy way. I get to learn something new every day without ever feeling overwhelmed.
